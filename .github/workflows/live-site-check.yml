name: Live site check

# Opens fawanews.sc every few hours and runs each live game page through the app's link
# finder. A failure means the site changed how it hides links and the app needs a fix.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check every live game page
        working-directory: android
        env:
          LIVE_SITE_CHECK: "1"
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests "sc.fawanews.app.data.LiveSiteCheck"

      - name: Report
        if: always()
        run: cat android/app/build/live-site-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open an issue when the app stops finding links
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create live-site-check --color B60205 --force
          open=$(gh issue list --label live-site-check --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --label live-site-check \
              --title "Site changed: the app found no link on some live games" \
              --body-file android/app/build/live-site-report.md
          fi
